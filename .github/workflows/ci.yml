name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py excel_ai tests

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          pytest -vv --tb=short > pytest.log 2>&1
          exit_code=$?
          cat pytest.log
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest.log

      - name: Fail when tests fail
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
